
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: pgadmin-kv
  namespace: axion

spec:
  provider: azure

  secretObjects:
    - secretName: pgadmin-secrets
      type: Opaque
      data:
        - objectName: pgadmin-email
          key: PGADMIN_DEFAULT_EMAIL

        - objectName: pgadmin-password
          key: PGADMIN_DEFAULT_PASSWORD

  parameters:
    usePodIdentity: "false"
    clientID: "8b7a6186-afb5-4aea-b45e-80534f26f22c"
    
    keyvaultName: "secret02"
    tenantId: "9e93f898-a6b3-40d6-b6fd-690c77a95b13"

    objects: |
      array:
        - |
          objectName: pgadmin-email
          objectType: secret
        - |
          objectName: pgadmin-password
          objectType: secret