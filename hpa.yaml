
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pgadmin-hpa
  namespace: axion

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pgadmin

  minReplicas: 1
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: AverageValue
          averageValue: 250Mi

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60